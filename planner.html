<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner - BandungVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#6B21A8' }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } }
            }
        }
    </script>
    <link rel="stylesheet" href="css/globals.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .leaflet-container { font-family: inherit; }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden bg-purple-50">
    
    <!-- Navbar overlay -->
    <nav class="absolute top-0 left-0 w-full z-20 p-6 pointer-events-none flex justify-between items-start">
        <a href="index.html">
            <button class="bg-white p-3 rounded-full shadow-lg pointer-events-auto hover:bg-gray-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="m15 18-6-6 6-6"/></svg>
            </button>
        </a>
        <div class="pointer-events-auto flex items-center bg-white rounded-xl shadow-lg border border-purple-100 p-2 pr-4 pl-3">
            <div class="bg-primary text-white font-bold px-3 py-1 rounded-md mr-2">Bandung</div>
            <div class="text-primary font-semibold tracking-wide">Verse</div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="flex-1 w-full flex flex-col md:flex-row relative">
        
        <!-- Map Area (Background) -->
        <div class="flex-1 h-full relative z-0" id="map"></div>

        <!-- Sidebar Planner Area -->
        <div class="w-full md:w-[450px] h-full p-4 md:p-6 z-10 absolute right-0 top-0 pointer-events-none flex flex-col justify-end md:justify-center">
            <div class="h-[80vh] md:h-full w-full pointer-events-auto relative pt-16 md:pt-0" id="sidebar-container">
                
                <!-- Form View (Injected by JS) -->
                <div id="planner-form" class="bg-white p-6 rounded-3xl shadow-lg h-full flex flex-col hide-scrollbar overflow-y-auto">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                        Rencana Perjalanan
                    </h2>
                    
                    <div class="space-y-6 flex-1">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Pilih Tanggal</label>
                            <input type="date" id="input-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none text-gray-700 font-medium">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Jam Mulai Perjalanan</label>
                            <input type="time" id="input-time" value="08:00" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none text-gray-700 font-medium">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Kategori Destinasi</label>
                            <div class="grid grid-cols-2 gap-3">
                                <button class="cat-btn active bg-purple-100 text-primary border-2 border-primary py-3 rounded-xl font-bold text-sm transition-all" data-cat="Wisata">Wisata</button>
                                <button class="cat-btn active bg-purple-100 text-primary border-2 border-primary py-3 rounded-xl font-bold text-sm transition-all" data-cat="Kuliner">Kuliner</button>
                                <button class="cat-btn bg-gray-50 text-gray-500 border-2 border-transparent py-3 rounded-xl font-bold text-sm transition-all hover:bg-gray-100" data-cat="Budaya">Budaya</button>
                                <button class="cat-btn bg-gray-50 text-gray-500 border-2 border-transparent py-3 rounded-xl font-bold text-sm transition-all hover:bg-gray-100" data-cat="Teknologi">Teknologi</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Banyak Destinasi (1-7)</label>
                            <input type="range" id="input-count" min="1" max="7" value="4" class="w-full accent-primary">
                            <div class="flex justify-between text-xs text-gray-400 mt-1 font-semibold">
                                <span>1</span><span>7</span>
                            </div>
                        </div>
                    </div>
                    
                    <button id="btn-generate" class="w-full bg-primary hover:bg-[#581c87] text-white font-bold py-4 rounded-2xl shadow-lg mt-6 transition-all transform hover:-translate-y-1">
                        Generate Itinerary
                    </button>
                </div>

                <!-- Timeline View (Hidden by default) -->
                <div id="timeline-view" class="bg-white p-6 rounded-3xl shadow-lg h-full flex flex-col hide-scrollbar overflow-y-auto hidden">
                    <div class="flex items-center justify-between mb-6">
                        <button id="btn-back-timeline" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <h2 class="text-xl font-bold text-gray-900">Itinerary Anda</h2>
                        <div class="w-10"></div>
                    </div>

                    <div class="flex justify-between items-center mb-6 px-2">
                        <div>
                            <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">Tanggal</p>
                            <p class="font-bold text-primary" id="disp-date">12 Agustus 2026</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">Total</p>
                            <p class="font-bold text-primary" id="disp-count">4 Tempat</p>
                        </div>
                    </div>

                    <div class="flex-1 relative pb-6">
                        <!-- Timeline Line -->
                        <div class="absolute left-[27px] top-[10px] bottom-[20px] w-0.5 bg-purple-200 z-0"></div>
                        
                        <div id="timeline-items" class="space-y-6 relative z-10">
                            <!-- Items injected via JS -->
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/planner.js"></script>
    <!-- Bottom Nav (mobile only) -->
    <script src="js/bottom-nav.js"></script>
</body>
</html>
