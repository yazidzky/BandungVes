<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budaya - BandungVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=optional" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#6B21A8' }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } }
            }
        }
    </script>
    <link rel="stylesheet" href="css/globals.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .culture-card { transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); overflow: hidden; }
        .culture-card.active {
            height: 300px;
            border-radius: 2rem;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 20;
            cursor: default;
            filter: grayscale(0);
        }
        .culture-card.inactive {
            height: 90px;
            border-radius: 1.25rem;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 10;
            cursor: pointer;
            filter: grayscale(100%);
            opacity: 0.85;
        }
        .culture-card.inactive:hover { filter: grayscale(30%); opacity: 1; }
        
        /* Desktop: gambar utama jauh lebih besar, preview kecil & hitam-putih */
        @media (min-width: 768px) {
            .culture-card.active { height: 420px; border-radius: 2rem; }
            .culture-card.inactive { height: 120px; max-width: 280px; border-radius: 1.25rem; }
        }
        @media (min-width: 1024px) {
            .culture-card.active { height: 480px; }
            .culture-card.inactive { height: 130px; max-width: 320px; }
        }
        
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="bg-[#1a0b2e] min-h-screen w-full relative overflow-y-auto overflow-x-hidden flex flex-col" style="background-color:#1a0b2e;">
    
    <!-- Background -->
    <div class="fixed inset-0 z-0 bg-[#1a0b2e]">
        <img id="bg-img" src="" alt="Background" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-opacity duration-500" onerror="this.style.display='none'" />
        <div class="absolute inset-0 bg-[#2d0a4e]/85 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-[#2d0a4e] via-[#2d0a4e]/90 to-transparent"></div>
    </div>

    <!-- Header / Navbar -->
    <nav class="relative z-20 w-full p-4 md:p-6 flex items-center gap-3 md:gap-4">
        <!-- Back Button -->
        <a href="index.html">
            <button class="bg-white hover:bg-gray-100 text-[#7c3aed] w-11 h-11 md:w-12 md:h-12 shrink-0 rounded-full flex items-center justify-center shadow-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
        </a>

        <!-- Search Bar -->
        <div class="relative flex-1 max-w-full md:max-w-[320px]">
            <input 
                type="text" 
                id="search-input"
                placeholder="Cari Budaya (mis: Angklung)" 
                class="w-full bg-white px-5 py-3 rounded-full text-sm outline-none text-gray-700 shadow-lg placeholder-gray-400"
            />
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute right-4 top-1/2 -translate-y-1/2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="relative z-10 flex-1 w-full max-w-[1400px] mx-auto px-4 lg:px-12 flex flex-col md:flex-row gap-8 lg:gap-16 items-start pt-4 lg:pt-8 pb-28 md:pb-16">
        
        <!-- Detail section    top on mobile, right on desktop -->
        <div class="w-full md:w-6/12 lg:w-7/12 flex flex-col text-white pt-2 md:pt-4 order-first md:order-last" id="culture-detail">
            <!-- Details Injected Here -->
        </div>

        <!-- Image section    bottom on mobile (thumbnail grid), left on desktop (pill stack) -->
        <div class="w-full md:hidden" id="culture-thumbs-mobile">
            <!-- Mobile thumbnail grid injected here -->
        </div>

        <!-- Desktop: pill stack -->
        <div 
            class="hidden md:flex w-full md:w-6/12 lg:w-5/12 flex-col gap-3 lg:gap-4 max-h-[700px] lg:max-h-[850px] overflow-hidden pb-4 md:pb-8 order-last md:order-first" 
            style="-webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%); mask-image: linear-gradient(to bottom, black 85%, transparent 100%);"
            id="culture-list"
        >
            <!-- Culture Cards Injected Here -->
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/budaya.js?v=2"></script>
    <!-- Bottom Nav (mobile only) -->
    <script src="js/bottom-nav.js"></script>
</body>
</html>
