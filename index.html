<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BandungVerse - Jelajahi sejarah, budaya, kuliner, dan destinasi terbaik Bandung dalam satu pengalaman interaktif.">
    <title>BandungVerse - Jelajahi Bandung</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6B21A8',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
    <script src="js/motion-animations.js"></script>

    <!-- Custom CSS to mimic global.css -->
    <link rel="stylesheet" href="css/globals.css">
    <script>
        // Unregister any leftover Next.js Service Workers that might intercept and break vanilla HTML routing
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
    <style>
        /* Hide scrollbar utility */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Ensure all white sections stay white on dark body */
        #beranda, #beranda-desktop,
        #wisata-container, #kuliner-container, #teknologi-container {
            background-color: #ffffff;
        }

        .btn-ripple {
            position: relative; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-ripple:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(107, 33, 168, 0.4); }
        
        /* Initial state for Motion animations */
        .fade-in-up { opacity: 0; }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }
        .delay-600 { transition-delay: 600ms; }

        /* Wisata cards: mobile 3-col grid overflow, desktop flex full-height */
        .wisata-card-item { 
            position: relative;
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
        }
        /* Force hide mobile arrows on desktop regardless of position:fixed */
        @media (min-width: 768px) {
            #btn-wisata-prev-mobile,
            #btn-wisata-next-mobile { display: none !important; }
            .wisata-card-item { 
                width: auto; 
                flex: 1; 
                height: 100%; 
                border-radius: 16px;
            }
            #kuliner-container > section { padding-top: 64px !important; }
        }
        /* Mobile: kuliner needs top spacing for overflowing wisata cards */
        @media (max-width: 767px) {
            #kuliner-container > section { padding-top: 125px !important; }
        }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col pb-0 md:pb-0">

    <!-- Navigation Desktop -->
    <nav class="w-full bg-white/70 backdrop-blur-md fixed top-0 z-50 hidden md:flex justify-between items-center px-8 py-4 shadow-sm">
        <div class="flex items-center">
            <img src="assets/img/logo_bandung_verse.svg" alt="Bandung Verse" class="h-10" onerror="this.style.display='none'" />
        </div>
        <div class="flex items-center gap-6 text-sm font-semibold text-gray-600">
            <a href="#wisata" class="nav-link-hover hover:text-[#4c1d95]" onclick="smoothScrollTo('wisata',event)">Wisata</a>
            <a href="#kuliner" class="nav-link-hover hover:text-[#4c1d95]" onclick="smoothScrollTo('kuliner',event)">Kuliner</a>
            <a href="#teknologi" class="nav-link-hover hover:text-[#4c1d95]" onclick="smoothScrollTo('teknologi',event)">Teknologi</a>
            <a href="#budaya" class="nav-link-hover hover:text-[#4c1d95]" onclick="smoothScrollTo('budaya',event)">Budaya</a>
        </div>
    </nav>
    <script>
    function smoothScrollTo(id, e) {
        e.preventDefault();
        // Try anchor id first, fallback to container id
        var el = document.getElementById(id) || document.getElementById(id + '-container');
        if (!el) return;
        var offset = 80;
        var top = el.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top: top, behavior: 'smooth' });
    }
    </script>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col">

        <!-- ===== HERO MOBILE (sesuai Figma) ===== -->
        <section id="beranda" class="md:hidden w-full relative flex flex-col items-center px-5 pt-12 pb-0 overflow-hidden">
            <!-- Background Image with Overlay -->

                <div class="col-span-1 row-span-1 mt-6">
                    <div class="w-full h-44 rounded-3xl shadow-md bg-purple-200 animate-pulse" id="hero-img-1-wrap">

                </div>

                    <div class="w-full h-44 rounded-3xl shadow-md bg-purple-200 animate-pulse" id="hero-img-2-wrap">

            <!-- Signpost buttons    tiang di tengah, sisi tempel tiang = lurus -->

                <!-- Tiang vertikal    dari atas sampai bawah container (= border ungu wisata) -->
                <div class="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-2 bg-[#3b0764] z-0" style="border-radius:4px 4px 0 0;"></div>

                <!-- "Jelajahi Bandung >"    kanan dari tiang, sisi kiri lurus -->
                <div class="relative z-10 w-full flex justify-end pr-4">
                    <a href="explore.html">
                        <button class="bg-[#4c1d95] text-white font-bold px-7 py-3.5 shadow-lg flex items-center gap-2 text-[0.95rem]" style="border-radius:0 999px 999px 0;">
                            Jelajahi Bandung
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </button>

                </div>

                <!-- "< Bandung Tempo Dulu"    kiri dari tiang, sisi kanan lurus -->
                <div class="relative z-10 w-full flex justify-start pl-4">
                    <a href="story.html">
                        <button class="bg-[#4c1d95] text-white font-bold px-7 py-3.5 shadow-lg flex items-center gap-2 text-[0.95rem]" style="border-radius:999px 0 0 999px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>

        <!-- ===== HERO DESKTOP ===== -->
        <section id="beranda-desktop" class="hidden md:flex relative w-full min-h-[90vh] items-center justify-between px-16 pt-20 overflow-hidden">
            <!-- Background Image with Overlay -->
            <div class="absolute inset-0 z-0">
                <img src="assets/img/bgmenu_awaltampilan.jpg" class="w-full h-full object-cover" alt="Background" onerror="this.style.display='none'" />
                <div class="absolute inset-0 bg-white/70"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-white/90 via-white/50 to-transparent"></div>
            </div>
            
            <div class="absolute right-0 top-0 w-1/2 h-full opacity-100 grid grid-cols-2 gap-4 p-8 pt-24 pointer-events-none z-10">
                <div class="flex flex-col gap-4 mt-12">
                    <div class="w-full h-48 rounded-[2rem] shadow-lg bg-purple-200/20 animate-pulse fade-in-up delay-100" id="desk-img-0-wrap">
                        <img id="desk-img-0" src="" class="w-full h-48 object-cover rounded-[2rem] shadow-lg fade-in-up delay-100 hidden" />
                    </div>
                    <div class="w-full h-56 rounded-[2rem] shadow-lg bg-purple-200/20 animate-pulse fade-in-up delay-400" id="desk-img-1-wrap">
                        <img id="desk-img-1" src="" class="w-full h-56 object-cover rounded-[2rem] shadow-lg fade-in-up delay-400 hidden" />

                <div class="flex flex-col gap-4">
                    <div class="w-full h-64 rounded-[2rem] shadow-lg bg-purple-200/20 animate-pulse fade-in-up delay-200" id="desk-img-2-wrap">

            <div class="z-20 max-w-xl fade-in-up visible relative">

                <h1 class="text-5xl lg:text-6xl font-bold text-gray-900 leading-tight mb-6">

                <p class="text-lg text-gray-600 mb-8 max-w-md">Jelajahi sejarah, budaya, kuliner, dan destinasi terbaik Bandung dalam satu pengalaman interaktif.</p>
                <div class="relative mt-12 w-fit">
                    <!-- Tiang vertikal    di kiri tombol "Jelajahi" dan di kanan tombol "Tempo Dulu" -->
                    <div class="absolute w-[8px] bg-purple-900 z-0" style="left:216px; top:-30px; height:300px; border-radius:4px 4px 0 0;"></div>
                    <!-- "Jelajahi Bandung"    mulai dari tiang ke kanan, sisi kiri lurus (tempel tiang), sisi kanan pill -->
                    <div class="flex w-[440px] relative z-10">
                        <div class="w-[216px]"></div>
                        <a href="explore.html">
                            <button class="btn-ripple bg-[#4c1d95] text-white pl-7 pr-8 py-3 font-bold shadow-md flex items-center gap-3 whitespace-nowrap" style="border-radius:0 999px 999px 0;">
                                Jelajahi Bandung
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                            </button>
                        </a>
                    </div>
                    <!-- "< Bandung Tempo Dulu"    berakhir di tiang dari kiri, sisi kiri pill, sisi kanan lurus (tempel tiang) -->
                    <div class="flex w-[440px] relative z-10 mt-2">
                        <a href="story.html">
                            <button class="btn-ripple bg-[#4c1d95] text-white pl-8 pr-7 py-3 font-bold shadow-md flex items-center gap-3 whitespace-nowrap" style="border-radius:999px 0 0 999px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                Bandung Tempo Dulu
                            </button>

                </div>
            </div>
        </section>

        <!-- Dynamic Sections Container -->
        <!-- Desktop: tiang extension dari hero signpost ke section wisata -->
        <div class="hidden md:block relative" style="height:0; overflow:visible; z-index:5;">
            <div id="tiang-extension" style="position:absolute; width:8px; background:#3b0764; border-radius:0 0 4px 4px; top:0; left:0; height:60px; display:none;"></div>
        </div>
        <!-- Static anchor IDs for desktop nav    always available regardless of JS -->
        <div id="wisata" style="height:0;"></div>
        <div id="wisata-container" class="-mt-12 z-20 relative"></div>

        <div id="teknologi" style="height:0;"></div>

    <!-- jQuery for DOM Manipulation -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Main Script -->
    <script>
        const FALLBACK_IMG = "assets/img/placeholders/wisata-1-0.svg";

        $(document).ready(function() {
            // Show skeleton loader
            if (window.BVMotion) window.BVMotion.showSkeleton();

            // Trigger entry animations
            setTimeout(() => {
                $('.fade-in-up').addClass('visible');
            }, 100);

            // Desktop: extend tiang from hero signpost to wisata section border
            function positionTiangExtension() {
                if (window.innerWidth < 768) return;
                const tiangEl = document.getElementById('tiang-extension');
                const heroSection = document.getElementById('beranda-desktop');
                const wisataContainer = document.getElementById('wisata-container');
                if (!tiangEl || !heroSection || !wisataContainer) return;

                // Horizontal position: same as desktop tiang (left of hero content + 216px offset)
                // Hero content starts at px-16 (64px), signpost at mt-12 from text start
                // Tiang at left:216px within the signpost div which is within max-w-xl content
                // Approximate: 64px (px-16) + tiang offset within content
                const heroRect = heroSection.getBoundingClientRect();
                const wisataRect = wisataContainer.getBoundingClientRect();
                
                // Find the actual tiang element in hero to get its x position
                const heroTiang = heroSection.querySelector('.absolute.w-\\[8px\\]');
                if (!heroTiang) { tiangEl.style.display = 'none'; return; }
                
                const tiangRect = heroTiang.getBoundingClientRect();
                const containerRect = document.querySelector('.hidden.md\\:block.relative').getBoundingClientRect();
                
                // Position extension tiang
                const leftPos = tiangRect.left - containerRect.left + (tiangRect.width / 2) - 4;
                const gapHeight = wisataRect.top - heroRect.bottom + 48; // +48 for -mt-12 offset
                
                tiangEl.style.left = leftPos + 'px';
                tiangEl.style.height = Math.max(gapHeight, 0) + 'px';
                tiangEl.style.display = gapHeight > 0 ? 'block' : 'none';
            }

            setTimeout(positionTiangExtension, 200);
            window.addEventListener('resize', positionTiangExtension);

            // Initialize global observer using Motion
            if (window.BVMotion) {
                window.BVMotion.setupScrollReveal();
            } else {
                window.observer = {
                    observe: function(el) { $(el).addClass('visible'); }
                };
            }

            // Function to load and render Wisata Grid
            function renderWisataGrid(onDone) {
                $.getJSON('data/wisata.json?v=' + Date.now(), function(data) {
                    const CARDS_PER_PAGE = 3;
                    let page = 0;
                    const totalPages = Math.ceil(data.length / CARDS_PER_PAGE);

                    function renderPage() {
                        // Both mobile and desktop show 3 per page
                        const currentItems = data.slice(page * CARDS_PER_PAGE, page * CARDS_PER_PAGE + CARDS_PER_PAGE);
                        
                        function makeCard(wisata, index) {
                            return `
                                <a href="view.html?v=4&id=${wisata.id}" class="wisata-card-item group shadow-lg">
                                    <img src="${wisata.image || FALLBACK_IMG}" alt="${wisata.nama}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" onerror="this.onerror=null;this.src=FALLBACK_IMG"/>
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                                    <div class="absolute bottom-0 left-0 right-0 p-3 text-white">
                                        <h3 class="font-bold text-[0.82rem] leading-tight mb-1">${wisata.nama}</h3>
                                        <div class="flex items-center gap-1 text-[0.7rem] font-semibold text-white/80">
                                            Eksplorasi
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                        </div>
                                    </div>
                                </a>`;
                        }

                        const cardsHtml = currentItems.map((w, i) => makeCard(w, i)).join('');
                        
                        // Fill empty slots if needed
                        let fillerHtml = '';
                        if (currentItems.length < CARDS_PER_PAGE) {
                            for (let i = 0; i < CARDS_PER_PAGE - currentItems.length; i++) {
                                fillerHtml += `<div style="border-radius:16px;background:rgba(255,255,255,0.1);"></div>`;
                            }
                        }
                        const fullHtml = cardsHtml + fillerHtml;

                        var prevPage = page;
                        $('#wisata-cards-mobile').html(fullHtml);
                        $('#wisata-cards-desktop').html(fullHtml);

                        // Pagination state
                        $('#btn-wisata-prev, #btn-wisata-prev-mobile').prop('disabled', page === 0).css('opacity', page === 0 ? 0.5 : 1);
                        $('#btn-wisata-next, #btn-wisata-next-mobile').prop('disabled', page === totalPages - 1).css('opacity', page === totalPages - 1 ? 0.5 : 1);
                    }

                    const sectionHtml = `
                        <!-- Mobile: "Sedang Trending" -->
                        <div class="md:hidden" style="position:relative; z-index:1;">
                            <!-- Purple bg block: header + deskripsi saja, berakhir sebelum cards -->
                            <div style="background:#4c1d95; padding:20px 0 20px 0;">
                                <div class="flex items-center justify-between mb-3 px-4">
                                    <div class="flex items-center gap-2">
                                        <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center shrink-0">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                                        </div>
                                        <span class="font-bold text-white text-[1rem]">Sedang Trending</span>
                                    </div>
                                    <a href="explore.html">
                                        <button class="flex items-center gap-1.5 bg-white text-[#4c1d95] text-[0.78rem] font-bold px-4 py-2 rounded-full shadow-sm">
                                            Eksplor Tren
                                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                        </button>
                                    </a>
                                </div>
                                <p class="text-white/85 text-[0.85rem] leading-relaxed px-4">Ikuti tren di Bandung dan temukan pengalaman seru yang sedang banyak diminati. Jangan sampai Kamu ketinggalan</p>
                            </div>
                            <div style="background:linear-gradient(to bottom, #4c1d95, white); height:195px; position:relative;">
                                <div id="wisata-cards-mobile" class="grid gap-2 px-4" style="grid-template-columns:repeat(3,1fr); position:absolute; top:20px; left:0; right:0;">
                                </div>
                                <!-- Mobile arrows (absolute to this relative container) -->
                                <button id="btn-wisata-prev-mobile" class="btn-ripple flex items-center justify-center" style="position:absolute; width:40px; height:40px; left:6px; top:130px; background:white; color:#4c1d95; border-radius:50%; box-shadow:0 4px 20px rgba(0,0,0,0.3); border:none; cursor:pointer; z-index:50;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                </button>
                                <button id="btn-wisata-next-mobile" class="btn-ripple flex items-center justify-center" style="position:absolute; width:40px; height:40px; right:6px; top:130px; background:white; color:#4c1d95; border-radius:50%; box-shadow:0 4px 20px rgba(0,0,0,0.3); border:none; cursor:pointer; z-index:50;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Desktop: full wisata section -->
                        <section class="hidden md:block relative w-full bg-gradient-to-r from-[#4c1d95] from-[32%] via-[#e9d5ff] to-white pt-16 pb-0" style="overflow:visible;">
                            <div class="relative z-10 flex flex-row px-16 gap-8 max-w-[1400px] mx-auto fade-in-up items-end">
                                <div class="w-[280px] shrink-0 text-white flex flex-col justify-between pb-16" style="min-height:320px;">
                                    <div>
                                        <div class="w-11 h-11 border border-white/30 rounded-xl flex items-center justify-center mb-5">
                                            <img src="assets/img/ic_destinasi_wisata.svg" alt="Wisata" class="w-6 h-6" onerror="this.style.display='none'" />
                                        </div>
                                        <h2 class="text-[1.75rem] font-extrabold leading-snug mb-4">Destinasi<br/>Wisata</h2>
                                        <p class="text-white/80 text-[0.85rem] leading-relaxed pr-4">Ikuti wisata di Bandung dan temukan pengalaman seru yang sedang banyak diminati. Jangan sampai Kamu ketinggalan</p>
                                    </div>
                                    <div class="flex flex-col gap-4 mt-6">
                                        <div class="flex gap-3">

                                    </div>

                                    <!-- Gap + Arrow up -->
                                    <div class="flex justify-center items-center shrink-0" style="height:40px;">
                                        <button class="budaya-up-btn w-10 h-10 bg-white text-purple-900 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-transform z-20">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                                        </button>
                                    </div>

                                    <!-- Main image    flex-1 mengisi sisa ruang -->
                                    <div class="flex-1 mx-6 rounded-3xl overflow-hidden shadow-2xl relative z-10" style="min-height:300px;">
                                        <a class="budaya-link absolute inset-0 block" href="#">
                                            <img class="budaya-main-img absolute inset-0 w-full h-full object-cover transition-all duration-500 hover:scale-105 cursor-pointer" src="" />
                                        </a>
                                    </div>

                                    <!-- Gap + Arrow down -->
                                    <div class="flex justify-center items-center shrink-0" style="height:40px;">
                                        <button class="budaya-down-btn w-10 h-10 bg-white text-purple-900 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-transform z-20">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                        </button>
                                    </div>

                                    <!-- Next peek -->
                                    <div class="shrink-0 overflow-hidden rounded-t-3xl mx-6" style="height:110px; margin-bottom:0;">
                                        <img class="budaya-next-img w-full h-full object-cover object-top transition-all duration-500" src="" />
                                    </div>

                                </div>

                            </div><!-- end desktop -->
                        </section>
                    `;
                    $('#budaya-container').html(initialHtml);
                    $('#budaya-container .fade-in-up').each(function() { window.observer.observe(this); });

                    function updateContent() {
                        const item = data[activeItem];
                        const img = item.image || (item.gambar && item.gambar[0]) || FALLBACK_IMG;

                        const prevIdx = (activeItem - 1 + data.length) % data.length;
                        const nextIdx = (activeItem + 1) % data.length;
                        const prevItem = data[prevIdx];
                        const nextItem = data[nextIdx];
                        const prevImg = prevItem.image || (prevItem.gambar && prevItem.gambar[0]) || FALLBACK_IMG;
                        const nextImg = nextItem.image || (nextItem.gambar && nextItem.gambar[0]) || FALLBACK_IMG;

                        // Content update function
                        function _doUpdate() {
                            // Update both mobile + desktop elements
                            $('#budaya-bg').attr('src', img);
                            $('.budaya-main-img').attr('src', img);
                            $('.budaya-prev-img').attr('src', prevImg);
                            $('.budaya-next-img').attr('src', nextImg);
                            $('.budaya-link').attr('href', `view.html?v=4&id=${item.id}`);

                            const titleTxt = item.nama || '';
                            const descTxt = item.deskripsi || '';
                            $('#budaya-title').text(titleTxt);
                            $('#budaya-desc').text(descTxt);
                            $('#budaya-title-desktop').text(titleTxt);
                            $('#budaya-desc-desktop').text(descTxt);

                            let catsHtml = '';
                            let catsHtmlDesktop = '';
                            if (item.kategori) {
                                const cats = Array.isArray(item.kategori) ? item.kategori : item.kategori.split('/');
                                cats.forEach(cat => {
                                    catsHtml += `<span class="px-4 py-1.5 bg-white text-purple-900 rounded-full text-xs font-bold">${cat.trim()}</span>`;
                                    catsHtmlDesktop += `<span class="px-4 py-1 bg-white text-purple-900 rounded-full text-sm font-bold">${cat.trim()}</span>`;
                                });
                            } else {
                                catsHtml = `<span class="px-4 py-1.5 border border-white text-white rounded-full text-xs font-semibold">Budaya</span>`;
                                catsHtmlDesktop = `<span class="px-4 py-1 bg-white text-purple-900 rounded-full text-sm font-bold">Budaya</span>`;
                            }
                            $('#budaya-cats').html(catsHtml);
                            $('#budaya-cats-desktop').html(catsHtmlDesktop);
                            $('#budaya-bg').css('opacity', 0.4);
                        }

                        // Use Motion animation if available, else simple fade
                        if (window.BVMotion && window._budayaSwitchDir) {
                            window.BVMotion.animateBudayaSwitch(window._budayaSwitchDir, _doUpdate);
                        } else {
                            _doUpdate();
                        }

                        // Thumbnails (mobile + desktop)
                        let thumbsHtml = '';
                        for (let i = 0; i < 4; i++) {
                            const idx = (activeItem + i) % data.length;
                            const tItem = data[idx];
                            const tImg = tItem.image || (tItem.gambar && tItem.gambar[0]) || FALLBACK_IMG;
                            const isFirst = i === 0;
                            thumbsHtml += `
                                <button data-idx="${idx}" class="budaya-thumb w-16 h-16 md:w-20 md:h-20 shrink-0 rounded-2xl overflow-hidden border-2 transition-all ${isFirst ? 'border-white opacity-100' : 'border-transparent opacity-50 hover:opacity-100'}">
                                    <img src="${tImg}" class="w-full h-full object-cover" />
                                </button>
                            `;
                        }
                        $('#budaya-thumbs, #budaya-thumbs-desktop').html(thumbsHtml);
                    }

                    // Attach events to static container
                    $('#budaya-container').on('click', '.budaya-up-btn', function() {
                        activeItem = (activeItem - 1 + data.length) % data.length;
                        window._budayaSwitchDir = 'up';
                        updateContent();
                    });
                    $('#budaya-container').on('click', '.budaya-down-btn', function() {
                        activeItem = (activeItem + 1) % data.length;
                        window._budayaSwitchDir = 'down';
                        updateContent();
                    });
                    $('#budaya-container').on('click', '.budaya-thumb', function() {
                        activeItem = parseInt($(this).attr('data-idx'));
                        updateContent();
                    });

                    updateContent();
                    if (typeof onDone === 'function') onDone();
                });
            } // end renderBudaya

            // Call renders
            let _sectionsLoaded = 0;
            function _sectionDone() {
                _sectionsLoaded++;
                // Activate fade-in-up globally since there's no splash screen
                $('.fade-in-up').addClass('visible');
                // Dismiss skeleton when all 4 sections are done
                if (_sectionsLoaded >= 4) {
                    if (window.BVMotion) {
                        window.BVMotion.dismissSkeleton();
                        window.BVMotion.animateHeroEntry();
                    }
                }
            }

            // Load hero images from real wisata data
            $.getJSON('data/wisata.json?v=' + Date.now(), function(wisataData) {
                const heroImgs = wisataData.slice(0, 4).map(w => w.image || (w.gambar && w.gambar[0]) || '');
                // Mobile hero
                heroImgs.forEach((src, i) => {
                    if (!src) return;
                    const img = document.getElementById('hero-img-' + i);
                    const wrap = document.getElementById('hero-img-' + i + '-wrap');
                    if (img && wrap) {
                        img.onload = function() {
                            wrap.classList.remove('animate-pulse', 'bg-purple-200');
                            img.classList.remove('hidden');
                        };
                        img.src = src;
                    }
                });
                // Desktop hero
                heroImgs.forEach((src, i) => {
                    if (!src) return;
                    const img = document.getElementById('desk-img-' + i);
                    const wrap = document.getElementById('desk-img-' + i + '-wrap');
                    if (img && wrap) {
                        img.onload = function() {
                            wrap.classList.remove('animate-pulse', 'bg-purple-200');
                            img.classList.remove('hidden');
                        };
                        img.src = src;
                    }
                });
            });

            renderWisataGrid(_sectionDone);
            renderKulinerGrid(_sectionDone);
            renderTeknologi(_sectionDone);
            renderBudaya(_sectionDone);
            // Fallback: dismiss skeleton after 6s if not all sections loaded
            setTimeout(function() {
                if (window.BVMotion) window.BVMotion.dismissSkeleton();
            }, 6000);
        });
    </script>
    <!-- Bottom Nav (mobile only) -->
    <script src="js/bottom-nav.js"></script>
    <script src="js/img-skeleton.js"></script>
</body>
</html>
