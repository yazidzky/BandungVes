<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknologi - BandungVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=optional" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#3a506b' }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } }
            }
        }
    </script>
    <link rel="stylesheet" href="css/globals.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tech-card { transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); }
        .tech-card.active { height: 520px; border-radius: 2rem; border: 2px solid rgba(255,255,255,0.2); z-index: 20; cursor: default; filter: grayscale(0); }
        .tech-card.inactive { height: 200px; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.2); z-index: 10; cursor: pointer; filter: grayscale(100%); max-width: 280px; }
        .tech-card.inactive:hover { filter: grayscale(0); }
        
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="bg-[#0b132b] min-h-screen w-full relative overflow-y-auto overflow-x-hidden flex flex-col">
    
    <!-- Background -->
    <div class="absolute inset-0 z-0 bg-[#0b132b]">
        <img id="bg-img" src="" alt="Background" class="absolute inset-0 w-full h-full object-cover opacity-50 transition-opacity duration-500" onerror="this.style.display='none'" />
        <div class="absolute inset-0 bg-[#1c2541]/85 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-[#0b132b] via-[#1c2541]/90 to-transparent"></div>
    </div>

    <!-- Header Overlay -->
    <nav class="relative z-20 w-full p-4 md:p-6 flex items-center gap-3 md:gap-4">
        <!-- Back Button -->
        <a href="index.html">
            <button class="bg-white hover:bg-gray-100 text-[#7c3aed] w-11 h-11 md:w-12 md:h-12 shrink-0 rounded-full flex items-center justify-center shadow-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
        </a>

        <!-- Search Bar — full-width on mobile -->
        <div class="relative flex-1 max-w-full md:max-w-[320px]">
            <input 
                type="text" 
                id="search-input"
                placeholder="Cari Teknologi (mis: Bosscha)" 
                class="w-full bg-white px-5 py-3 rounded-full text-sm outline-none text-gray-700 shadow-lg placeholder-gray-400"
            />
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute right-4 top-1/2 -translate-y-1/2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
        </div>
    </nav>

    <!-- Main Content Area -->
    <!-- Mobile: detail top + thumbnail grid bottom. Desktop: cards left, detail right. -->
    <main class="relative z-10 flex-1 max-w-7xl mx-auto w-full px-4 md:px-8 flex flex-col lg:flex-row gap-8 lg:gap-20 items-start pt-4 lg:pt-8 pb-28 lg:pb-16">
        
        <!-- Detail section — top on mobile, right on desktop -->
        <div class="w-full lg:w-7/12 flex flex-col text-white pt-2 lg:pt-4 order-first lg:order-last" id="tech-detail">
            <!-- Details Injected Here -->
        </div>

        <!-- Mobile thumbnail grid -->
        <div class="w-full lg:hidden" id="tech-thumbs-mobile">
            <!-- Mobile thumbnail grid injected here -->
        </div>

        <!-- Desktop: pill stack -->
        <div 
            class="hidden lg:flex w-full lg:w-5/12 flex-col gap-6 max-h-[700px] lg:max-h-[900px] overflow-hidden pb-8 order-last lg:order-first" 
            style="-webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%); mask-image: linear-gradient(to bottom, black 80%, transparent 100%);"
            id="tech-list"
        >
            <!-- Tech Cards Injected Here -->
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/teknologi.js"></script>
    <!-- Bottom Nav (mobile only) -->
    <script src="js/bottom-nav.js"></script>
</body>
</html>
